<!-- name + bio -->
<g transform="translate(232,56)">
  <text x="0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#0a3a8a">SEBASTIAN</text>
  <text x="0" y="56" font-family="Consolas, monospace" font-size="13" fill="#5a6272" letter-spacing="1">Software Engineering Student  |  Mexico</text>

  <g transform="translate(0,68)">
