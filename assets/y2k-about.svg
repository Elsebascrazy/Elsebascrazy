  <radialGradient id="avatarBack" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#eef1f5"/>
    <stop offset="100%" stop-color="#b7bec9"/>
  </radialGradient>
  <clipPath id="aboutPanelClip"><rect x="0" y="0" width="900" height="330" rx="14"/></clipPath>
  <clipPath id="avatarCircleClip"><circle cx="80" cy="80" r="62"/></clipPath>
</defs>

<rect x="0" y="0" width="900" height="330" rx="14" fill="url(#body2)"/>
<rect x="1" y="1" width="898" height="328" rx="13" fill="none" stroke="#0a3a8a" stroke-width="2"/>

<g clip-path="url(#aboutPanelClip)">
  <rect x="0" y="0" width="900" height="42" fill="url(#titlebar2)"/>
