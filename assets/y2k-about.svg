</g>
<text x="40" y="27" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1">about_me.html - Windows Editor</text>
<g>
  <rect x="822" y="12" width="16" height="14" rx="2" fill="#d9e4f5" stroke="#0a3a8a" stroke-width="1"/>
  <line x1="825" y1="23" x2="835" y2="23" stroke="#0a3a8a" stroke-width="1.3"/>
  <rect x="844" y="12" width="16" height="14" rx="2" fill="#d9e4f5" stroke="#0a3a8a" stroke-width="1"/>
