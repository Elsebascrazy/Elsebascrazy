    <rect x="102" y="0" width="150" height="24" rx="12" fill="#eaf6ff" stroke="#1c5fc7" stroke-width="1.5"/>
    <text x="177" y="16" text-anchor="middle" fill="#0a3a8a">CLOUD CURIOUS</text>
    <rect x="264" y="0" width="130" height="24" rx="12" fill="#eaf6ff" stroke="#1c5fc7" stroke-width="1.5"/>
    <text x="329" y="16" text-anchor="middle" fill="#0a3a8a">WEB DESIGN</text>
