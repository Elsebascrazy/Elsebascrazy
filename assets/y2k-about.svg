<!-- avatar frame : plain grey generic-user icon -->
<g transform="translate(40,64)">
  <rect x="-6" y="-6" width="172" height="192" rx="14" fill="url(#frameGrey)" stroke="#2f333c" stroke-width="3"/>
  <rect x="0" y="0" width="160" height="160" rx="8" fill="#eef1f5"/>
  <circle cx="80" cy="80" r="62" fill="url(#avatarBack)" stroke="#8891a0" stroke-width="2"/>
