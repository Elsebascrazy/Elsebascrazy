  <text x="0" y="132" font-family="Consolas, monospace" font-size="14" fill="#12141c">Currently learning Python, React, Laravel and Java.</text>
  <text x="0" y="154" font-family="Consolas, monospace" font-size="14" fill="#12141c">Interested in cloud architecture (AWS, Azure) and</text>
  <text x="0" y="176" font-family="Consolas, monospace" font-size="14" fill="#12141c">web design. This profile keeps growing as I learn.</text>

  <text x="0" y="204" font-family="Consolas, monospace" font-size="12" fill="#7a4b08" font-style="italic">"destiny can be changed only in the present"</text>

