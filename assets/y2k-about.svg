<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="titlebar2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3f8cf3"/>
    <stop offset="45%" stop-color="#1c5fc7"/>
    <stop offset="100%" stop-color="#0a3a8a"/>
  </linearGradient>
  <linearGradient id="body2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f4f8ff"/>
    <stop offset="100%" stop-color="#dfeaff"/>
  </linearGradient>
  <linearGradient id="frameGrey" x1="0" y1="0" x2="1" y2="1">
