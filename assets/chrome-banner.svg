<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e5fc4"/>
    <stop offset="45%" stop-color="#6fb1e8"/>
    <stop offset="100%" stop-color="#cfeafc"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eaf6ff"/>
    <stop offset="45%" stop-color="#8fc7f2"/>
    <stop offset="100%" stop-color="#1c5fc7"/>
  </linearGradient>
  <linearGradient id="glassHi" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="floppy" cx="35%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#9adcff"/>
    <stop offset="100%" stop-color="#1c5fc7"/>
  </radialGradient>
  <clipPath id="frame"><rect x="0" y="0" width="900" height="280" rx="18"/></clipPath>
  <clipPath id="titleClip">
    <text x="450" y="150" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="3">SEBAS</text>
  </clipPath>
</defs>

<g clip-path="url(#frame)">
  <rect x="0" y="0" width="900" height="280" fill="url(#sky)"/>
  <ellipse cx="120" cy="55" rx="70" ry="22" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="175" cy="45" rx="50" ry="18" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="760" cy="40" rx="80" ry="24" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="820" cy="55" rx="45" ry="16" fill="#ffffff" opacity="0.75"/>
  <ellipse cx="700" cy="230" rx="90" ry="20" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="150" cy="245" rx="110" ry="22" fill="#ffffff" opacity="0.3"/>

  <path d="M0 260 L900 260 L900 210 L800 250 L700 200 L600 245 L500 205 L400 250 L300 210 L200 248 L100 205 L0 240 Z" fill="#4a8fd8" opacity="0.55"/>

  <!-- avatar frame -->
  <g transform="translate(38,34)">
    <rect x="-4" y="-4" width="86" height="86" rx="10" fill="#0a3a8a"/>
    <rect x="0" y="0" width="78" height="78" rx="8" fill="#5cb85c" stroke="#2d6a2d" stroke-width="3"/>
    <rect x="8" y="8" width="62" height="62" rx="4" fill="#eaf6ff"/>
    <circle cx="39" cy="30" r="12" fill="url(#floppy)"/>
    <rect x="20" y="46" width="38" height="16" rx="2" fill="#1c5fc7"/>
    <rect x="26" y="50" width="26" height="4" fill="#eaf6ff"/>
    <rect x="26" y="56" width="16" height="3" fill="#eaf6ff"/>
  </g>

  <!-- corner construction ribbon -->
  <g>
    <path d="M760 0 L900 0 L900 60 Z" fill="#111111"/>
    <path d="M765 4 L896 4 L896 56 Z" fill="#f5c500"/>
    <text x="800" y="30" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#111111" transform="rotate(45 800 30)">UNDER</text>
    <text x="812" y="42" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#111111" transform="rotate(45 812 42)">CONSTR.</text>
  </g>

  <!-- title glass plate -->
  <rect x="150" y="78" width="600" height="96" rx="24" fill="url(#glass)" stroke="#0a3a8a" stroke-width="2"/>
  <rect x="150" y="78" width="600" height="48" rx="24" fill="url(#glassHi)"/>

  <text x="452" y="152" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="3" fill="#0a3a8a" opacity="0.5">SEBAS</text>
  <text x="450" y="150" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="3" fill="#ffffff" stroke="#0a3a8a" stroke-width="1.5">SEBAS</text>
  <rect x="170" y="88" width="560" height="34" fill="#ffffff" opacity="0.4" clip-path="url(#titleClip)"/>

  <path d="M690 90 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M180 165 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z" fill="#ffffff" opacity="0.8"/>

  <text x="450" y="200" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="4" fill="#0a3a8a">PERSONAL HOMEPAGE // WEB DESIGNER ARCHIVE</text>

  <!-- marquee ticker -->
  <rect x="14" y="234" width="872" height="26" rx="13" fill="#0a3a8a" opacity="0.55"/>
  <rect x="16" y="236" width="868" height="10" rx="5" fill="#ffffff" opacity="0.25"/>
  <clipPath id="marqueeClip"><rect x="16" y="234" width="868" height="26"/></clipPath>
  <g clip-path="url(#marqueeClip)">
    <text x="900" y="252" font-family="Consolas, monospace" font-size="14" letter-spacing="2" fill="#ffffff">
      <animate attributeName="x" from="900" to="-1500" dur="20s" repeatCount="indefinite"/>
    </text>
  </g>
</g>
<rect x="1.5" y="1.5" width="897" height="277" rx="17" fill="none" stroke="#0a3a8a" stroke-width="3"/>
</svg>
